# Baut das Docker-Image der FinTS-Brücke für PC (amd64) und Raspberry Pi (arm64)
# und legt es in der GitHub Container Registry ab. Der Pi muss dann nichts selbst bauen.
name: Bridge-Image
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/bridge-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jghosting/mymoney-bridge:latest
            ghcr.io/jghosting/mymoney-bridge:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/JGHosting/mymoney
            org.opencontainers.image.description=FinTS-Brücke für Meine Finanzen
          cache-from: type=gha
          cache-to: type=gha,mode=max
